---

# Base docker-compose config to define the system services

version: '3.7'

x-template:
  common: &common
    image: api
    build:
      context: backend
      dockerfile: Docker/api.Dockerfile
    restart: unless-stopped

services:
  api_server:
    <<: *common
    command: >
      uvicorn main:app --host 0.0.0.0 --port 80 --root-path /api

    depends_on:
      - arangodb

  webapp_main:
    build:
      context: webapps/main
      dockerfile: Dockerfile
    command: npm run serve

  arangodb:
    image: arangodb
    restart: unless-stopped
    volumes:
      - arangodb:/var/lib/arangodb3
      - ./backend/db_backup:/db_backup
    environment:
      ARANGO_NO_AUTH: "1"

  nginx:
    image: nginx:1.18
    restart: unless-stopped
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "80:80"

volumes:
  arangodb:
