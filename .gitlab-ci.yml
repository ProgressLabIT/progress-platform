    - docker pull $WEBAPP_IMAGE:build-stage || true

    # Navigate to build context
    - cd $WEBAPP_ROOT

    # Build global-deps image (first section of the Dockerfile), using cached layers when available. The tagging overwrites the image with the updated one
    - >
      docker build
      --pull
      --cache-from $WEBAPP_IMAGE:dev-global-deps-stage
      --target global-deps-stage
      -t $WEBAPP_IMAGE:dev-global-deps-stage
      -f $WEBAPP_DOCKERFILE
      .

    # develop-stage
    - >
      docker build
      --pull
      --cache-from $WEBAPP_IMAGE:dev-develop-stage
      --target develop-stage
      -t $WEBAPP_IMAGE:dev-develop-stage
      -f $WEBAPP_DOCKERFILE
      .

    # build-stage
    - >
      docker build
      --pull
      --cache-from $WEBAPP_IMAGE:dev-build-stage
      --target build-stage
      -t $WEBAPP_IMAGE:dev-build-stage
      -f $WEBAPP_DOCKERFILE
      .

    # Build the final image using cached layers from each stage's image. Tag the image with current pipeline ID and `latest` tag.
    - >
      docker build
      --pull
      --cache-from $WEBAPP_IMAGE:dev-global-deps-stage
      --cache-from $WEBAPP_IMAGE:dev-develop-stage
      --cache-from $$WEBAPP_IMAGE:dev-latest
      -t $WEBAPP_IMAGE:dev-latest
      -t $WEBAPP_IMAGE:dev-$TIMESTAMP
      -f $WEBAPP_DOCKERFILE
      .

    # Push new images to the registry
    - docker push $WEBAPP_IMAGE:dev-global-deps-stage
    - docker push $WEBAPP_IMAGE:dev-develop-stage
    - docker push $WEBAPP_IMAGE:dev-latest
    - docker push $WEBAPP_IMAGE:dev-$TIMESTAMP


