workflow:
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^release\/.*$/
      if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/

services:
  - docker:dind

# Login to GitLab container Registry for push and pull operations
default:
  before_script:
    # - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD registry.gitlab.com

# Just extract version info
version-info:
  stage: .pre
  image: alpine:latest
  script:
    - |
      # Extract version from tag
      echo "VERSION=${CI_COMMIT_TAG#v}" >> build.env
      # Extract version from branch name (e.g., release/0.9 -> 0.9)
      echo "BRANCH_VERSION=${CI_COMMIT_BRANCH#release/}" >> build.env
  artifacts:
    reports:
      dotenv: build.env

# Build Webapp image and push it to registry.
build:webapp:
  stage: build
  image: docker:stable
  needs:
    - version-info
  variables:
    WEBAPP_ROOT: webapps/main
    WEBAPP_DOCKERFILE: webapp.prod.Dockerfile
    IMAGE_NAME: $CI_REGISTRY_IMAGE/app
  rules:
    - changes:
        - webapps/main/**/*
  script:
    - cd $WEBAPP_ROOT
    - >
      docker build
      --pull
      -t $IMAGE_NAME:$BRANCH_VERSION-latest
      -f $WEBAPP_DOCKERFILE
      .
    - docker push $IMAGE_NAME:$BRANCH_VERSION-latest

build:api:
  stage: build
  image: docker:stable
  needs:
    - version-info
  variables:
    API_ROOT: backend/api
    API_DOCKERFILE: Dockerfile
    IMAGE_NAME: $CI_REGISTRY_IMAGE/api
  rules:
    - changes:
        - backend/api/**/*
  script:
    - cd $API_ROOT
    - >
      docker build
      --pull
      -t $IMAGE_NAME:$BRANCH_VERSION-latest
      -f $API_DOCKERFILE
      .
    - docker push $IMAGE_NAME:$BRANCH_VERSION-latest

build:workflow:
  stage: build
  image: docker:stable
  needs:
    - version-info
  variables:
    WF_ROOT: backend/workflow
    WF_DOCKERFILE: Dockerfile
    IMAGE_NAME: $CI_REGISTRY_IMAGE/wf-sys-agent
  rules:
    - changes:
        - backend/workflow/**/*
  script:
    - cd $WF_ROOT
    - >
      docker build
      --pull
      -t $IMAGE_NAME:$BRANCH_VERSION-latest
      -f $WF_DOCKERFILE
      .
    - docker push $IMAGE_NAME:$BRANCH_VERSION-latest

tag-version:
  stage: build
  image: docker:stable
  needs:
    - version-info
  variables:
    SERVICES: >- # the dash strips newlines at the end avoid potential errors in the loop below
      app
      api
      wf-sys-agent
  script:
    - |
      for SERVICE in $SERVICES; do
        docker pull $CI_REGISTRY_IMAGE/$SERVICE:$BRANCH_VERSION-latest
        docker tag $CI_REGISTRY_IMAGE/$SERVICE:$BRANCH_VERSION-latest $CI_REGISTRY_IMAGE/$SERVICE:$VERSION
        docker push $CI_REGISTRY_IMAGE/$SERVICE:$VERSION
      done
