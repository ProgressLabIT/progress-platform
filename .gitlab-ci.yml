services:
  - docker:dind

# Login to GitLab container Registry for push and pull operations
before_script:
  # - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD registry.gitlab.com
  - export TIMESTAMP=$(date +%Y%m%d-%H%M)

# Just extract version info
version-info:
  stage: .pre
  image: alpine:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/
      if: $CI_COMMIT_BRANCH =~ /^release\/.*$/
  script:
    - |
      # Extract version from tag
      echo "VERSION=${CI_COMMIT_TAG#v}" >> build.env
      # Extract version from branch name (e.g., release/0.9 -> 0.9)
      echo "BRANCH_VERSION=${CI_COMMIT_BRANCH#release/}" >> build.env
  artifacts:
    reports:
      dotenv: build.env

# Build Webapp image and push it to registry.
build:webapp:
  stage: build
  image: docker:stable
  needs:
    - version-info
  variables:
    WEBAPP_ROOT: webapps/main
    WEBAPP_DOCKERFILE: webapp.prod.Dockerfile
    IMAGE_NAME: $CI_REGISTRY_IMAGE/app
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/
      if: $CI_COMMIT_BRANCH =~ /^release\/.*$/
      changes:
        - webapps/main/**/*
  script:
    - cd $WEBAPP_ROOT
    - >
      docker build
      --pull
      -t $IMAGE_NAME:$BRANCH_VERSION-latest
      -f $WEBAPP_DOCKERFILE
      .
    - docker push $IMAGE_NAME:$BRANCH_VERSION-latest

build:api:
  stage: build
  image: docker:stable
  needs:
    - version-info
  variables:
    API_ROOT: backend/api
    API_DOCKERFILE: Dockerfile
    IMAGE_NAME: $CI_REGISTRY_IMAGE/api
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/
      if: $CI_COMMIT_BRANCH =~ /^release\/.*$/
      changes:
        - backend/api/**/*
  script:
    - cd $API_ROOT
    - >
      docker build
      --pull
      -t $IMAGE_NAME:$BRANCH_VERSION-latest
      -f $API_DOCKERFILE
      .
    - docker push $IMAGE_NAME:$BRANCH_VERSION-latest

build:workflow:
  stage: build
  image: docker:stable
  needs:
    - version-info
  variables:
    WF_ROOT: backend/workflow
    WF_DOCKERFILE: Dockerfile
    IMAGE_NAME: $CI_REGISTRY_IMAGE/wf-sys-agent
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/
      if: $CI_COMMIT_BRANCH =~ /^release\/.*$/
      changes:
        - backend/workflow/**/*
  script:
    - cd $WF_ROOT
    - >
      docker build
      --pull
      -t $IMAGE_NAME:$BRANCH_VERSION-latest
      -f $WF_DOCKERFILE
      .
    - docker push $IMAGE_NAME:$BRANCH_VERSION-latest

tag:webapp:
  stage: tag
  image: docker:stable
  needs:
    - version-info
  variables:
    IMAGE_NAME: $CI_REGISTRY_IMAGE/app
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/
      if: $CI_COMMIT_BRANCH =~ /^release\/.*$/
  script:
    - docker pull $IMAGE_NAME:$BRANCH_VERSION-latest
    - docker tag $IMAGE_NAME:$BRANCH_VERSION-latest $IMAGE_NAME:$VERSION
    - docker push $IMAGE_NAME:$VERSION

tag:api:
  stage: tag
  image: docker:stable
  needs:
    - version-info
  variables:
    IMAGE_NAME: $CI_REGISTRY_IMAGE/api
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/
      if: $CI_COMMIT_BRANCH =~ /^release\/.*$/
  script:
    - docker pull $IMAGE_NAME:$BRANCH_VERSION-latest
    - docker tag $IMAGE_NAME:$BRANCH_VERSION-latest $IMAGE_NAME:$VERSION
    - docker push $IMAGE_NAME:$VERSION

tag:workflow:
  stage: tag
  image: docker:stable
  needs:
    - version-info
  variables:
    IMAGE_NAME: $CI_REGISTRY_IMAGE/wf-sys-agent
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/
      if: $CI_COMMIT_BRANCH =~ /^release\/.*$/
  script:
    - docker pull $IMAGE_NAME:$BRANCH_VERSION-latest
    - docker tag $IMAGE_NAME:$BRANCH_VERSION-latest $IMAGE_NAME:$VERSION
    - docker push $IMAGE_NAME:$VERSION
