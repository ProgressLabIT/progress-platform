user  nginx;
worker_processes  4;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;

    keepalive_timeout  65;

    gzip  on;

    resolver 127.0.0.11 ipv6=off;

    client_max_body_size 1g;
    client_body_buffer_size 128k;

    proxy_connect_timeout 90;
    proxy_send_timeout 600;
    proxy_read_timeout 600;
    send_timeout 600;

    proxy_buffer_size 4k;
    proxy_buffers 4 32k;
    proxy_busy_buffers_size 64k;
    proxy_temp_file_write_size 64k;

    server {
        listen       80;
        server_name  progress.docker localhost;

        # location ~ ^/$ {
        #     return 302 $scheme://$host/api/v1/docs/;
        # }

        location ~ ^/api/ {

            # Without this the name is resolved at boot and nginx fails to start if
            # the container isn't already up
            set $backend_api_server api_server;

            rewrite ^/api(.*) $1 break;

            proxy_pass http://$backend_api_server;

            proxy_redirect off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        location ~ ^/ {

            set $webapp_main_server webapp_main;
            proxy_pass http://$webapp_main_server:8080;

            proxy_redirect off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }
    }
}
