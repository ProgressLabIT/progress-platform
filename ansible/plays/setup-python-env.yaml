---
- name: Setup environment
  hosts: all
  tasks:
    - name: Install pip
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600
        name: python3-pip

    - name: Install arangodb and docker sdk
      ansible.builtin.pip:
        name:
          - docker
          - python-arango

    - name: Update requests and its dependencies
      ansible.builtin.pip:
        name: requests
        extra_args: --upgrade
