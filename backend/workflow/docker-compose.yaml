version: "3.9"

networks:
  workflow:
  dev_default:
    external: true

services:
  server: # Workflow Server
    image: prefecthq/prefect:2.8.3-python3.11
    restart: always
    volumes:
      - ~/.prefect:/root/.prefect
    entrypoint: ["prefect", "server", "start"]
    networks:
      - workflow
    environment:
      - PREFECT_API_URL=http://0.0.0.0:4200/api
      - PREFECT_SERVER_API_HOST=0.0.0.0
    ports:
      - 4200:4200

  system-agent: # System Workflow Agent
    image: prefecthq/prefect:2.8.3-python3.11
    restart: always
    entrypoint: ["prefect", "agent", "start", "-q", "system"]
    volumes:
      - ./flows:/flows
    networks:
      - dev_default
      - workflow
    environment:
      - PREFECT_API_URL=http://server:4200/api

  integration-agent: # Client Workflow Agent
    image: prefecthq/prefect:2.8.3-python3.11
    restart: always
    entrypoint: ["prefect", "agent", "start", "-q", "default"]
    volumes:
      - ./flows:/flows
    networks:
      - dev_default
      - workflow
    environment:
      - PREFECT_API_URL=http://server:4200/api
