# ========================
# MASTER DATA
# ========================

# Product:
	code: str
	description: str
	active: bool
	trash: bool
  version: 
    code: str
    valid_from: ISOdts
    valid_until: ISOdts 
	cost:
    target: float
    average: float
  sale_price: float
  margin:
    target: float
    average: float
	
# Operation
	code: str
	description: str
	value_adding: bool
  hourly_cost: float

# Phase
	name: str
  product: rel (1:1 --belongs_to--> 1:N)
		- sequence: int
	product: rel (0:N --requires--> 0:N) 	# e.g. for sub-assemblies
		- required_qt: float
	operation: rel (1:1 --requires--> 0:N)
    - std_processing_time: float
	checklist: bool
  # rel 0:N --requires--> 0:N Items (BomItems)
    - required_qt: float
  resource: rel (0:N --requires--> 0:N)
  params:
    # material_check_mandatory: bool
    # missing_items_allowed: bool
    parallel_job_allowed: bool
    step_check: str [(see specs for options)]
    step_check_force_order: bool
    job_sequence: str [fixed, flex, dynamic]
      # ??? Does it make sense at the phase level?
    release_style: str [(see specs for options)]
    complete_batch_qt: float
    release_batch_qt: float

# Task
  * phase: _key
  sequence: int
  title: str
  description: str 
  doc: list(str) # doc title
  type: str [pictext, markdown, json-form]
  form_fields: 
    - field_type: _key
    - field_name: str
    - field_desc: str
    # - validation_rules: str

# ProductionItems (Items)
  _key: str (product code)
  type: str [part, consumable, tool]
  description: str
  standard_cost: float

# User
	active: bool
  permissions:
		admin: bool
		planner: bool
		operator: bool
		resource: rel (0:N --has_access_to--> 1:N)
	name: str (index)
	surname: str (index)
	login_code: str
	psw_hash: str
	status: str [logged_in, working, logged_out]
  last_user_session: _key
  # experience: rel (0:N --carries_out--> 0:N)
  #   - exp_level: float

# Customers
  _key: str (customer code)
  name: str

# ResourceClass
	name: str
	description: str
	parent_class: rel (0:1 --belongs_to--> 0:N)

# Resource
	name: str
	description: str
	brand: str
  model: str
	serial: str
	# rel 0:N --belongs_to--> 0:N Department
	# rel 0:N <--requires-- 0:N Operation
	# rel 1:N <--has_access_to-- 0:N User

# Department
	name: str
	code: str
