	# operation: rel (0:N --carries_out--> 0:N)
	# site: rel (1:1 --belongs_to--> 0:N)

# ProductionItem
  code: str
  description: str
  * class: _key (ProductionItemClass)

# ProductionItemClass
  name: str
  description: str
