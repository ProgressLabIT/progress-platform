# Product:
	* code: str
	*ft description: str
	* active: bool
	* trash: bool
	cost:
    target: float
    average: float
  sale_price: float
  margin:
    target: float
    average: float
  technical_batch_qt: float
  economic_order_qt: float
  minimum_order_qt: float
  tags: list[str]
    - tag_key: _key
  process_phases: list[str]

# Tag:
  *ft name: str
  color: hex
  * target: str [Product, ProductionItem]
	
# Operation
	code: str
	description: str
	value_adding: bool
  hourly_cost: float
  # rel 0:N --requires--> 0:N EquipmentClass (OperationEquipment)


# Phase
	alias: str
  description: str
  product: str # _id
  # rel 1:1 <--requires-- 1:N Product (ProductPhase)
	# rel 0:N --requires--> 0:N Product (SubAssembly)	# e.g. for sub-assemblies
		- required_qt: float
	# rel 1:1 --requires--> 0:N Operation (PhaseOp)
  # rel 0:N --requires--> 0:N Items (BomItems)
    - required_qt: float
  # rel 0:N --requires--> 0:N EquipmentClass (PhaseEquipment)
    - default_equipment_id: _key
  # rel 0:N --assigned_to--> 0:N UserGroup / User
  std_processing_time: int # milliseconds
  step_sequence: List[str] # Step _id
  params:
    # material_check_mandatory: bool
    # missing_items_allowed: bool
    parallel_job_allowed: bool
    step_check: str [NONE, SINGLE, FIXED_BATCH, MANUAL_BATCH, JOB]
    step_check_force_order: bool
    release_style: str [CONTINUOUS, BATCH, SESSION, MANUAL, JOB]
    production_batch_qt: float
    release_batch_qt: float

# Step
  phase: _key
  title: str
  description: str 
  # doc: List[str] # doc title
  type: str [instruction, form, checklist]
  checks: List[str]
  input_fields: list[obj]
    - field_type: str [(see specs)]
    - field_name: str
    - field_desc: str
    - mandatory: bool
    # - validation_rules: str

# ProductionItems (Items)
  * code: str
  * type: str [component, consumable, tool, safety]
  *ft description: str
  standard_cost: float

# User
	active: bool
  permissions:
		admin: bool
		planner: bool
		operator: bool
		resource: rel (0:N --has_access_to--> 1:N)
	name: str (index)
	surname: str (index)
	login_code: str
	psw_hash: str
	status: str [logged_in, working, logged_out]
  last_user_session: _key
  # rel 0:N --belongs_to--> 0:N Group (UserGroup)
  # rel 0:N <--assigned_to-- 0:N Phase/Job (PhaseOwner, JobOwner)
  # experience: rel (0:N --carries_out--> 0:N)
  #   - exp_level: float

# Group
  code: str
  name: str
  # 0:N <--assigned_to-- 0:N Phase/Job (PhaseOwner, JobOwner)

# Customers
  _key: str (customer code)
  name: str

# EquipmentClass
	name: str
	description: str
	# rel 0:1 --belongs_to--> 0:N EquipmentClass (ParentEquipmentClass)

# Equipment
	name: str
	description: str
	brand: str
  model: str
	serial: str
