# ========================
# COMMON
# ========================
# _key
# created_at
# created_by

# ========================
# MASTER DATA
# ========================

# Product:
	code: str
	description: str
	active: bool
	trash: bool
  version: 
    code: str
    valid_from: ISOdts
    valid_until: ISOdts 
	target_cost: float 
	wip:
		qt: float
		value: float //considers only target cost
	
# Operation
	code: str
	description: str
	value_adding: bool

# Phase
	name: str
  product: rel (1:1 --belongs_to--> 1:N)
		- sequence: int
	product: rel (0:N --requires--> 0:N) 	# e.g. for sub-assemblies
		- qt: float
	operation: rel (1:1 --requires--> 0:N)
    - std_processing_time: float
	checklist: bool
  items: rel (0:N --requires--> 0:N)
    - required_qt: float
  resource: rel (0:N --requires--> 0:N)
  params:
    missing_items_allowed: bool
    parallel_job_allowed: bool
    step_check: str [(see specs for options)]
    step_check_force_order: bool
    job_sequence: str [fixed, flex, dynamic]
    release_style: str [(see specs for options)]
    complete_batch_qt: float
    release_batch_qt: float

# Task
  phase: rel (1:1 --belongs_to--> 0:N)
    - sequence: int
  title: str
  description: str 
  doc: list(str) # doc title
  type: str [instruction, form]
  form_fields: rel (0:N --belongs_to-->field_type 0:N)
    - field_name: str
    - field_desc: str
    # - validation_rules: str

# ProductionItems (Items)
  _key: str (product code)
  type: str [part, consumable, tool]
  description: str
  standard_cost: float

# User
	active: bool
  permissions:
		admin: bool
		planner: bool
		operator: bool
		resource: rel (0:N --has_access_to--> 1:N)
	name: str (index)
	surname: str (index)
	login_code: str
	psw_hash: str
	status: str [logged_in, working, logged_out]
  # experience: rel (0:N --carries_out--> 0:N)
  #   - exp_level: float

# Customers
  _key: str (customer code)
  name: str

# ResourceClass
	name: str
	description: str
	parent_class: rel (0:1 --belongs_to--> 0:N)

# Resource
	name: str
	description: str
	brand: str
  model: str
	serial: str
	department: rel (0:N --belongs_to--> 0:N)
	operation: rel (0:N <--requires-- 0:N)
	user: rel (1:N <--has_access_to-- 0:N)

# Department
	name: str
	code: str
	user: rel (0:N <--assigned_to-- 0:N)
	equipment: rel (0:N <--belongs_to-- Resource N:N)
	operation: rel (0:N --carries_out--> 0:N)
	# site: rel (1:1 --belongs_to--> 0:N)


