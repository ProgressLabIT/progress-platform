# WIP
  _from: _key (Phase)
  _to: _key (Phase)
  * wo_line: _key
  * product: _key
  release_type: str [continuous, batch, session, manual, job]
  total_qt: float
  released_qt: float
  value: float

# UserSession
  _key: str (random)
  login: ISOdts
  logout: ISOdts
  duration: float # seconds
  # rel 1:1 --belongs_to--> 0:N User

# WorkSession (rel)
  _from: UserSession
  _to: Job
  _key: str (random)
  * user: str
  master_session: bool
  start: ISOdts
  end: ISOdts
  duration: float # seconds

# WorkOrderLine
  * wo_code: str
  wo_line_no: int
  * product: _key
  qt_planned: float
  qt_produced: float
  qt_scrapped: float
  created_at: ISOdts
  started_at: ISOdts
  planned_at: ISOdts
  finished_at: ISOdts
  due_by: ISOdts
  delay: float
  lead_time: float
  troughput_time: 
    target: float
    value: float
    perf_vs_target: float
  processing_time: 
    target: float
    value: float
    perf_vs_target: float

# JobPerf
  lead_time: float
  throughput_time: 
    target: float
    value: float
    perf_vs_target: float
  processing_time:
    target: float 
    value: float
    perf_vs_target: float

# Run
  * job: str
  run_no: int
  start: ISOdts
  end: ISOdts
  duration: float
  batch_qt: float
  pass_qt: float
  scrap_qt: float
  # serial_number: str
    # actual product serial numbers will not be included in the first version
    # this field holds "fake" SNs in the form of an underscore + sequence number in the job
    # such as _1, _2, _3, etc. to distinguish from actual serial numbers 
    # that may be introduced in the near future.
    # in case of multi-item batches, the SN will be in the form _n:m

# TaskData (rel)
  # task_data is populated only when the job step_check parameter is not "none"
  _from: Run
  _to: Task
  evid: str
  * job: _key
  * user: _key
  completed: ISOdts
  time: float
  data: obj
    - <field_name_1>: <field_value_1>
    - ...
    - <field_name_N>: <field_value_N> 



