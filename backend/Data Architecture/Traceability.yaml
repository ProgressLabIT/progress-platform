# JobPerf
  lead_time: float
  throughput_time: 
    target: float
    value: float
    perf_vs_target: float
  processing_time:
    target: float 
    value: float
    perf_vs_target: float

# Batch
  * job: _id
  work_session_list: list(_id)
  # iteration_index: int
  start: ISOdts
  end: ISOdts
  duration: float
  # batch_qt: float
  pass_qt: float
  scrap_qt: float
  shown_step_index: int 
  steps: list(step)
    - _id
    - ...
    - status: ['to_do', 'completed', 'critical']
  # serial_number: str
    # actual product serial numbers will not be included in the first version
    # this field holds "fake" SNs in the form of an underscore + sequence number in the job
    # such as _1, _2, _3, etc. to distinguish from actual serial numbers 
    # that may be introduced in the near future.
    # in case of multi-item batches, the SN will be in the form _n:m

# StepData
  # task_data is populated only when the job step_check parameter is not "none"
  evid: str
  * job: _id
  * user: _id
  * work_session: _id
  * batch: _id
  * step: _id
  completed: ISOdts
  duration: float
  user_data: obj
    - <field_name_1>: <field_value_1>
    - ...
    - <field_name_N>: <field_value_N> 

# WorkSessionBatchTiming
  * batch_id: str
  * ws_id: str
  duration: float






