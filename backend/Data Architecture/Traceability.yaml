# WIP
  _from: _id (Phase)
  _to: _id (Phase)
  * wo_id: _id
  * product: _id
  release_type: str [continuous, batch, session, manual, job]
  total_qt: float
  released_qt: float
  value: float

# UserSession
  * user: _id
  login: ISOdts
  logout: ISOdts
  duration: float # seconds

# WorkSession (rel)
  * user_session: _id
  * job: _id
  * user: _id
  master_session: bool
  start: ISOdts
  end: ISOdts
  duration: int

