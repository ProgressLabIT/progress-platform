# =======================
# QUALITY
# =======================

# IssueType
  _key: str (manual insertion code)
  name: str
  description: str
  icon: str

# Issue
  type: str (indexed foreign key)
  open: bool
  critical: bool
  * user: _key #rel (1:1 --created_by--> 0:N)
  * job: _key #rel (1:1 --refers_to--> 0:N)
  * product: _key #rel (1:1 --refers_to--> 0:N)
  * work_order: _key #rel (1:1 --refers_to--> 0:N)
  * operation: _key # rel (1:1 --refers_to--> 0:N)
  title: str
  description: str
  created_at: ISOdts
    # When issues are created by an operator, 
    # they are associated directly with the "active" entities: 
    # job, product, work order line, operation
    #
    # When issues are created by a planner/manager, 
    # such relationships must be associated explicitly
  closed_at: ISOdts
  opened_for: duration

# IssueUpdate
  issue: str (indexed foregin key)
  user: rel (1:1 --created_by--> 0:N)
  content: str

