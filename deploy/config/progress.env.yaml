---
# Environment variables for Progress Platform

# The host used for Traefik routing and URL construction.
# For cloud/domain deployments: mycompany.progresslab.it
# For local/IP-only deployments: 192.168.1.100
HOST: mycompany.progresslab.it

VERSION: 0.10.b36

# OPTIONAL: Set to 'true' to enable HTTPS/TLS with Let's Encrypt, 'false' or omit for HTTP-only (private networks)
# Default: true
ENABLE_TLS: true
TLS_EMAIL: admin@progresslab.it




