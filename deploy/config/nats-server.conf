# NATS server configuration for the Progress platform broker.
# Purpose: enable the MQTT 3.1.1 endpoint on port 1883 with JetStream-backed
# retained message store (required for Sparkplug B traffic per ADR-0001 / D-05).
# Mounted into the broker container at /etc/nats/nats-server.conf via base.yaml.

server_name: "progress_broker"

# NATS native protocol (existing port — kept).
listen: 0.0.0.0:4222
http_port: 8222

# JetStream — required for MQTT QoS 1 sessions and retained messages.
jetstream {
    store_dir: "/data/jetstream"
    max_memory_store: 256MB
    max_file_store: 2GB
}

# WebSocket endpoint (remote NATS clients behind firewalls that only allow 443).
# TLS is terminated upstream by Traefik on :443, which proxies the WS upgrade to
# this plaintext listener over the internal `progress` overlay — so `no_tls` here.
# Clients connect with `wss://<host>:443/nats` (see broker Traefik labels in stack.yaml).
websocket {
    port: 8090
    no_tls: true
}

# MQTT 3.1.1 endpoint (Sparkplug edge plane).
# NATS-MQTT bridges MQTT topics onto NATS subjects per ADR-0008 escape rules
# (`/` -> `.`, `.` -> `//`). Default account inherits JetStream when enabled
# at server level; no auth in Phase 1 (Phase 2+ adds Docker secrets).
mqtt {
    port: 1883
    ack_wait: "1m"
    max_ack_pending: 100
}
