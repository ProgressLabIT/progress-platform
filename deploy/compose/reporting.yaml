volumes:
  reports:
    external: true
  cmounts:
    external: true
  media:
    external: true

networks:
  progress:
    external: true

secrets:
  progress_api_db_pwd:
    external: true


services:
  reporting: # Streamlit app
    image: python:3.11-slim
    restart: unless-stopped
    volumes:
      - reports:/app
      - media:/media
      - cmounts:/cmounts
    networks:
      - progress
    secrets:
      - progress_api_db_pwd
    environment:
      # Load SUBDOMAIN and DOMAIN variables for entrypoint.sh
      SUBDOMAIN: ${SUBDOMAIN}
      DOMAIN: ${DOMAIN}
    entrypoint: >
      sh -c "chmod +x /app/entrypoint.sh && /app/entrypoint.sh"
    deploy:
      replicas: 1
      labels:
        # Main config
        - "traefik.enable=true"
        - "traefik.docker.network=progress"
        - "traefik.http.services.reporting.loadbalancer.server.port=8501"
        # Routing
        - "traefik.http.routers.reporting.rule=Host(`${SUBDOMAIN}.${DOMAIN}`) && PathPrefix(`/reporting`)"
        - "traefik.http.routers.reporting.service=reporting"
        - "traefik.http.routers.reporting.middlewares=strip-reporting-prefix"
        - "traefik.http.middlewares.strip-reporting-prefix.stripprefix.prefixes=/reporting"
        - "traefik.http.middlewares.strip-reporting-prefix.stripprefix.forceslash=false"
        # Ensure access is only via iframe from main sub.domain url
        - "traefik.http.routers.reporting.middlewares=embed-only,reporting-embed"
        - "traefik.http.middlewares.reporting-embed.headers.framedeny=false"
        # Allows embedding in iframe from main sub.domain url
        - "traefik.http.middlewares.reporting-embed.headers.customresponseheaders.Content-Security-Policy=frame-ancestors 'self' https://${SUBDOMAIN}.${DOMAIN}"
        # Prevents direct access to the app
        - "traefik.http.middlewares.embed-only.headers.customrequestheaders.X-Forwarded-Host=${SUBDOMAIN}.${DOMAIN}"
        # TLS
        - "traefik.http.routers.reporting.entrypoints=websecure"
        - "traefik.http.routers.reporting.tls.certresolver=letsencrypt"
