volumes:
  media:
    external: True
  db_backup:
    external: True
  db_data:
    external: True
  nats_data:
    external: True
  config:
    external: True

services:
  router:
    image: traefik:v2.11
    depends_on:
      - db
    volumes:
      # So that Traefik can listen to the Docker events
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    ports:
      - "80:80" # The HTTP port
      - "443:443" # The HTTPS post
      - "8080:8080" # The Web UI (enabled by --api.insecure=true)

  api:
    environment:
      - PROGRESS_ARANGO_URL=http://db:8529
      - PROGRESS_MEDIA_PATH=/media
      - PROGRESS_API_ROOT_PATH=/api
    ports:
      - "8000"
    volumes:
      - media:/media
    depends_on:
      - db
      - broker

  db:
    volumes:
      - db_data:/var/lib/arangodb3
      - db_backup:/db_backup
    ports:
      - "8529"

  broker:
    image: nats:2.12-alpine
    hostname: broker
    restart: unless-stopped
    command: ["-c", "/etc/nats/nats-server.conf"]
    volumes:
      - nats_data:/data
    ports:
      - "4222:4222"
      - "8222:8222"
      - "1883:1883"
    healthcheck:
      # NATS server has its own native health endpoint at /healthz on http_port (8222).
      # See https://docs.nats.io/running-a-nats-service/nats_admin/monitoring#health-endpoint
      # Using `wget` because the alpine base image has BusyBox wget (no curl in slim images).
      test:
        - "CMD-SHELL"
        - "wget -qO- http://127.0.0.1:8222/healthz || exit 1"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
