# TODO: OBJECT STORAGE MIGRATION - Update deployment configuration for object storage
# 1. Remove/update media volume mounting dependencies
# 2. Add object storage environment variables and secrets
# 3. Update API service configuration for object storage

volumes:
  media:
    external: True  # TODO: OBJECT STORAGE MIGRATION - Remove this volume as files will be in object storage
  db_backup:
    external: True
  db_data:
    external: True

services:
  router:
    image: traefik:v2.3
    depends_on:
      - db
    volumes:
      # So that Traefik can listen to the Docker events
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    ports:
      - "80:80" # The HTTP port
      - "443:443" # The HTTPS post
      - "8080:8080" # The Web UI (enabled by --api.insecure=true)

  api:
    environment:
      - PROGRESS_ARANGO_URL=http://db:8529
      - PROGRESS_MEDIA_PATH=/media  # TODO: OBJECT STORAGE MIGRATION - Replace with object storage configuration
      - PROGRESS_API_ROOT_PATH=/api
      # TODO: OBJECT STORAGE MIGRATION - Add object storage environment variables:
      # - PROGRESS_OBJECT_STORAGE_PROVIDER=s3|minio|gcs
      # - PROGRESS_OBJECT_STORAGE_BUCKET=your-bucket-name
      # - PROGRESS_OBJECT_STORAGE_ENDPOINT=https://s3.amazonaws.com
      # - PROGRESS_OBJECT_STORAGE_REGION=us-east-1
    ports:
      - "8000"
    volumes:
      - media:/media  # TODO: OBJECT STORAGE MIGRATION - Remove this volume mount
    depends_on:
      - db
      - broker

  db:
    volumes:
      - db_data:/var/lib/arangodb3
      - db_backup:/db_backup
    ports:
      - "8529"

  broker:
    image: apache/kafka:latest
    hostname: broker
    restart: unless-stopped
    #container_name: broker
    ports:
      - 9092:9092
      - 9101:9101
      - 19092:19092
      - 29093:29093
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT_HOST://localhost:9092,PLAINTEXT://broker:19092"
      KAFKA_LISTENERS: "CONTROLLER://:29093,PLAINTEXT_HOST://localhost:9092,PLAINTEXT://:19092"
      #KAFKA_LISTENERS: PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:9092
      #KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@broker:29093"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: localhost
