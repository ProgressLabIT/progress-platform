version: "3.9"

services:
  router:
    restart: unless-stopped
    command:
      - --providers.docker
      - --accesslog
      - --api.dashboard
      - --api.debug
      - --api.insecure
      - --log.level=INFO

  # app:
  #   restart: unless-stopped
  #   build:
  #     context: ./webapps/quasar
  #     dockerfile: webapp.dev.Dockerfile
  #   restart: unless-stopped
  #   labels:
  #     - traefik.http.routers.app.rule=Host(`${PROGRESS_ADDRESS:-progress.localhost}`)
  #     - traefik.http.routers.hmr.rule=Host(`${PROGRESS_ADDRESS:-progress.localhost:9000}`)
  #   command: yarn quasar dev --host 0.0.0.0
  #   volumes:
  #     # This is use to keep HMR working
  #     - "./webapps/quasar:/app"
  #     - /app/node_modules/ # exclude local node_modules folder from being linked into the container
  #     - "media:/app/public/media"
  #   environment:
  #     # the app will call the api server from outside the docker network, so the full Traefik host alias should be used
  #     - VUE_APP_API_BASE_URL=${PROGRESS_ADDRESS:-progress.localhost}/api
  #     - VUE_APP_I18N_LOCALE=it
  #     - VUE_APP_I18N_FALLBACK_LOCALE=it
  #   ports:
  #     - "9000"

  api:
    restart: unless-stopped
    build:
      context: ./backend/api #root folder for build
    volumes:
      - ./backend/api:/api
    environment:
      - PROGRESS_DB_NAME=PROGRESS_PROD
    command: >
      uvicorn main:app --host 0.0.0.0 --reload --log-level debug --use-colors
    labels:
      - "traefik.http.routers.api.rule=Host(`${PROGRESS_ADDRESS:-progress.localhost}`) && PathPrefix(`/api`)"
      - "traefik.http.middlewares.strip_api_prefix.stripprefix.prefixes=/api"
      - "traefik.http.middlewares.strip_api_prefix.stripprefix.forceslash=false"
      - "traefik.http.routers.api.middlewares=strip_api_prefix"

  db:
    image: arangodb:3.11 # Use this for Intel Processors
    #image: arm64v8/arangodb:3.11 # This works for Apple Silicon M1-M3 processors
    restart: unless-stopped
    environment:
      - ARANGO_NO_AUTH=1
    ports:
      - "8529:8529"
    labels:
      - "traefik.http.routers.db.rule=Host(`${PROGRESS_ADDRESS:-progress.localhost}`) && PathPrefix(`/_db`)"
      - "traefik.http.middlewares.db_root.replacepathregex.regex=^/_db/?$$"
      - "traefik.http.middlewares.db_root.replacepathregex.replacement=/"
      - "traefik.http.routers.db.middlewares=db_root"
  broker:
    image: confluentinc/confluent-local:latest
    hostname: broker
    container_name: broker
    ports:
      - "9092:9092"
      - "9101:9101"
    healthcheck:
      test: nc -z localhost 9092 || exit -1
      interval: 5s
      timeout: 10s
      retries: 100
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:9092"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: localhost
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@broker:29093"
      KAFKA_LISTENERS: "PLAINTEXT://broker:29092,CONTROLLER://broker:29093,PLAINTEXT_HOST://0.0.0.0:9092"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"

  schema-registry:
    image: confluentinc/cp-schema-registry:latest
    hostname: schema-registry
    container_name: schema-registry
    depends_on:
      - broker
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: "broker:29092"
