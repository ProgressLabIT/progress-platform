version: '3.1'

services:

  router:
    volumes:
      - "${TRAEFIK_CONFIG_FILE}:/etc/traefik/traefik.toml"

  app:
    image: registry.gitlab.com/progresslab/progress-platform/app
    volumes:
      - media:/usr/share/nginx/html/media
    ports:
      - "80"
    labels:
      - "traefik.http.routers.api.rule=Host(`${PROGRESS_ADDRESS:?err}`)"
      - "traefik.http.middlewares.strip_api_prefix.stripprefix.prefixes=/api"
      - "traefik.http.middlewares.strip_api_prefix.stripprefix.forceslash=false"
      - "traefik.http.routers.api.middlewares=strip_api_prefix"

  api:
    image: registry.gitlab.com/progresslab/progress-platform/api
    secrets:
      - progress_api_db_pwd
      - progress_jwt_secret
    environment:
      - PROGRESS_DB_NAME=PROGRESS_PROD
      - PROGRESS_API_DB_USERNAME=progress_api
    labels:
      - "traefik.http.routers.api.rule=Host(`${PROGRESS_ADDRESS:?err}`) && PathPrefix(`/api`)"
      - "traefik.http.middlewares.strip_api_prefix.stripprefix.prefixes=/api"
      - "traefik.http.middlewares.strip_api_prefix.stripprefix.forceslash=false"
      - "traefik.http.routers.api.middlewares=strip_api_prefix"
    command:
      ["gunicorn", "-k", "uvicorn.workers.UvicornWorker", "-b", "0.0.0.0:8000", "--access-logfile", "-", "main:app"]

  db:
    environment:
      - ARANGO_RANDOM_ROOT_PASSWORD=1
    deploy:
      replicas: 1
      labels:
        - "traefik.http.routers.db.rule=Host(`${PROGRESS_ADDRESS:-progress.localhost}`) && PathPrefix(`/_db`)"
        - "traefik.http.middlewares.db_root.replacepathregex.regex=^/_db/?$$"
        - "traefik.http.middlewares.db_root.replacepathregex.replacement=/"
        - "traefik.http.routers.db.middlewares=db_root"

  jupyterlab:
    image: registry.gitlab.com/progresslab/progress-platform/api
    ports:
      - "8888"
    volumes:
      - notebooks:/notebooks
    working_dir: /notebooks
    labels:
      - "traefik.http.routers.jupyterlab.rule=Host(`${PROGRESS_ADDRESS:?err}`) && PathPrefix(`/da`)"
      - "traefik.http.middlewares.strip_da_prefix.stripprefix.prefixes=/da"
      - "traefik.http.middlewares.strip_da_prefix.stripprefix.forceslash=false"
      - "traefik.http.routers.jupyterlab.middlewares=strip_da_prefix"
    command:
      ["jupyter", "lab"]
