volumes:
  media:
    external: true
  config:
    external: true

networks:
  progress:
    external: true

services:
  warehouse:
    image: registry.gitlab.com/progresslab/progress-platform/warehouse:${VERSION}
    volumes:
      # Swarm ignores volume.subpath (Compose/`docker run` only) and mounts the
      # whole `config` volume as a directory — nginx then 301-redirects /config.js
      # → /config.js/ over http, breaking as Mixed Content. Bind-mount the file.
      - type: bind
        source: /opt/progress/config/appConfig.js
        target: /usr/share/nginx/html/config.js
        read_only: true
      - media:/usr/share/nginx/html/media
    depends_on:
      - api
    networks:
      - progress
    deploy:
      replicas: 1
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=progress"
        - "traefik.http.services.warehouse.loadbalancer.server.port=80"
        - "traefik.http.routers.warehouse.rule=Host(`${HOST}`) && PathPrefix(`/wh`)"
        - "traefik.http.routers.warehouse.middlewares=strip_warehouse_prefix"
        - "traefik.http.middlewares.strip_warehouse_prefix.stripprefix.prefixes=/wh"
