networks:
  progress:
    external: true

secrets:
  progress_admin_pwd:
    external: true
  progress_api_db_pwd:
    external: true
  progress_jwt_secret:
    external: true
  progress_db_root_pwd:
    external: true
  dns_api_key:
    external: true
  dns_api_secret:
    external: true

volumes:
  letsencrypt:
    external: true


services:
  router:
    command:
      - --providers.docker.swarmMode
      - --providers.docker.exposedbydefault=false
      - --accesslog
      - --api.dashboard
      - --api.debug
      - --api.insecure
      - --log.level=INFO
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.letsencrypt.acme.dnschallenge=true
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.provider=${DNS_PROVIDER}
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.delaybeforecheck=${DNS_DELAY}
      - --certificatesresolvers.letsencrypt.acme.email=${DNS_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host
    volumes:
      - letsencrypt:/letsencrypt
    networks:
      - progress
    secrets:
      - dns_api_key
      - dns_api_secret
    env_file:
      # Includes DNS_API_KEY_FILE and DNS_API_SECRET_FILE for the appropriate DNS provider
      - /opt/progress/config/progress.env
    deploy:
      labels:
        - "traefik.enable=false"
        - "traefik.docker.network=progress"
      placement:
        constraints:
          - node.role == manager

  db:
    image: arangodb:3.11
    networks:
      - progress
    secrets:
      - progress_db_root_pwd
    environment:
      - ARANGO_ROOT_PASSWORD_FILE=/run/secrets/progress_db_root_pwd
    deploy:
      replicas: 1
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=progress"
        - "traefik.http.services.db.loadbalancer.server.port=8529"
        - "traefik.http.routers.db.rule=Host(`${SUBDOMAIN}.${DOMAIN:-progresslab.it}`) && PathPrefix(`/_db`)"
        - "traefik.http.routers.db.middlewares=db_root"
        - "traefik.http.middlewares.db_root.replacepathregex.regex=^/_db/?$$"
        - "traefik.http.middlewares.db_root.replacepathregex.replacement=/"
        - "traefik.http.routers.db.tls.certresolver=letsencrypt"

  broker:
    networks:
      - progress

  api:
    image: registry.gitlab.com/progresslab/progress-platform/api:${VERSION}
    volumes:
      - /opt/progress/config/api.env:/api/.env
    depends_on:
      - db
      - broker
    secrets:
      - progress_admin_pwd
      - progress_api_db_pwd
      - progress_jwt_secret
    environment:
      - PROGRESS_DB_NAME=PROGRESS_PROD
      - PROGRESS_API_DB_USERNAME=progress_api
    command:
      [
        "gunicorn",
        "-k",
        "uvicorn.workers.UvicornWorker",
        "-b",
        "0.0.0.0:8000",
        "--graceful-timeout",
        "1",
        "--access-logfile",
        "-",
        "main:app",
      ]
    networks:
      - progress
    deploy:
      replicas: 1
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=progress"
        - "traefik.http.services.api.loadbalancer.server.port=8000"
        - "traefik.http.routers.api.rule=Host(`${SUBDOMAIN}.${DOMAIN:-progresslab.it}`) && PathPrefix(`/api`)"
        - "traefik.http.routers.api.tls.certresolver=letsencrypt"
        - "traefik.http.routers.api.middlewares=strip_api_prefix"
        - "traefik.http.middlewares.strip_api_prefix.stripprefix.prefixes=/api"
        - "traefik.http.middlewares.strip_api_prefix.stripprefix.forceslash=false"


  app:
    image: registry.gitlab.com/progresslab/progress-platform/app:${VERSION}
    volumes:
      - /opt/progress/config/appConfig.js:/usr/share/nginx/html/config.js
      - media:/usr/share/nginx/html/media
    depends_on:
      - api
    ports:
      - "80"
    networks:
      - progress
    deploy:
      replicas: 1
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=progress"
        - "traefik.http.services.app.loadbalancer.server.port=80"
        - "traefik.http.routers.app.rule=Host(`${SUBDOMAIN}.${DOMAIN:-progresslab.it}`)"
        - "traefik.http.routers.app.tls.certresolver=letsencrypt"

