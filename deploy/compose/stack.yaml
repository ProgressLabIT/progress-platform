networks:
  progress:
    external: true

secrets:
  progress_admin_pwd:
    external: true
  progress_api_db_pwd:
    external: true
  progress_jwt_secret:
    external: true
  progress_db_root_pwd:
    external: true

services:
  router:
    command:
      - --providers.docker.swarmMode
      - --providers.docker.exposedbydefault=false
      - --accesslog
      - --api.dashboard
      - --api.debug
      - --api.insecure
      - --log.level=INFO
      - --entrypoints.web.address=:80
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
    networks:
      - progress
    deploy:
      labels:
        - "traefik.enable=false"
        - "traefik.docker.network=progress"
      placement:
        constraints:
          - node.role == manager

  db:
    image: arangodb:3.11
    networks:
      - progress
    secrets:
      - progress_db_root_pwd
    environment:
      - ARANGO_ROOT_PASSWORD_FILE=/run/secrets/progress_db_root_pwd
    deploy:
      replicas: 1
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=progress"
        - "traefik.http.services.db.loadbalancer.server.port=8529"
        - "traefik.http.routers.db.priority=10"
        - "traefik.http.routers.db.rule=Host(`${SUBDOMAIN}.${DOMAIN:-progresslab.it}`) && PathPrefix(`/_db`)"
        - "traefik.http.routers.db.middlewares=db_root"
        - "traefik.http.middlewares.db_root.replacepathregex.regex=^/_db/?$$"
        - "traefik.http.middlewares.db_root.replacepathregex.replacement=/"

  broker:
    networks:
      - progress
    environment:
      - PROGRESS_PRINT_SERVICE_NATS_URL=${PROGRESS_PRINT_SERVICE_NATS_URL:-nats://broker:4222}
      - PROGRESS_PRINT_SERVICE_API_URL=${PROGRESS_PRINT_SERVICE_API_URL:-http://api:8000/api}

  api:
    image: registry.gitlab.com/progresslab/progress-platform/api:${VERSION}
    volumes:
      - /opt/progress/config/api.env:/api/.env
    depends_on:
      - db
      - broker
    secrets:
      - progress_admin_pwd
      - progress_api_db_pwd
      - progress_jwt_secret
    environment:
      - PROGRESS_DB_NAME=PROGRESS_PROD
      - PROGRESS_API_DB_USERNAME=progress_api
    command:
      [
        "gunicorn",
        "-k",
        "uvicorn.workers.UvicornWorker",
        "-b",
        "0.0.0.0:8000",
        "--workers",
        "4",
        "--graceful-timeout",
        "5",
        "--access-logfile",
        "-",
        "main:app",
      ]
    networks:
      - progress
    deploy:
      replicas: 1
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=progress"
        - "traefik.http.services.api.loadbalancer.server.port=8000"
        - "traefik.http.routers.api.rule=Host(`${SUBDOMAIN}.${DOMAIN:-progresslab.it}`) && PathPrefix(`/api`)"
        - "traefik.http.routers.api.priority=10"
        - "traefik.http.routers.api.middlewares=strip_api_prefix"
        - "traefik.http.middlewares.strip_api_prefix.stripprefix.prefixes=/api"
        - "traefik.http.middlewares.strip_api_prefix.stripprefix.forceslash=false"


  app:
    image: registry.gitlab.com/progresslab/progress-platform/app:${VERSION}
    volumes:
      - /opt/progress/config/appConfig.js:/usr/share/nginx/html/config.js
      - media:/usr/share/nginx/html/media
    depends_on:
      - api
    ports:
      - "80"
    networks:
      - progress
    deploy:
      replicas: 1
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=progress"
        - "traefik.http.services.app.loadbalancer.server.port=80"
        - "traefik.http.routers.app.rule=Host(`${SUBDOMAIN}.${DOMAIN:-progresslab.it}`)"
        # Lower priority so path-based routes (workflow, notebooks, reports) take precedence
        - "traefik.http.routers.app.priority=1"

