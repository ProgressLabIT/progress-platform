version: "3.9"

services:
  router:
    restart: unless-stopped
    command:
      - --providers.docker
      - --accesslog
      - --api.dashboard
      - --api.debug
      - --api.insecure
      - --log.level=INFO

  # app:
  #   restart: unless-stopped
