# TLS Configuration for Production Deployment
#
# This file adds HTTPS/TLS support to the Progress Platform stack.
# It configures Traefik for:
# 1. Let's Encrypt automatic certificate provisioning (HTTP challenge)
# 2. Custom certificate support via file provider
# 3. HTTP to HTTPS redirects
#
# Usage with Ansible (Recommended):
#   Set ENABLE_TLS: true in deploy/config/progress.env.yaml
#   The single_node_setup.yaml playbook will automatically include this file
#
# Manual Usage:
#   docker stack deploy -c base.yaml -c stack.yaml -c tls.yaml \
#     --project-directory . --project-name progress_prod
#
# For deployments WITHOUT TLS (private networks, development):
#   Set ENABLE_TLS: false (or omit) in progress.env.yaml, or
#   Simply omit this file from the docker stack deploy command
#

volumes:
  letsencrypt:
    external: true

services:
  router:
    command:
      # Base commands (must be repeated here as command: replaces, not merges)
      - --providers.docker.swarmMode
      - --providers.docker.exposedbydefault=false
      - --accesslog
      - --api.dashboard
      - --api.debug
      - --api.insecure
      - --log.level=INFO
      - --entrypoints.web.address=:80
      # HTTPS entrypoint
      - --entrypoints.websecure.address=:443
      # HTTP to HTTPS redirect
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      # Let's Encrypt certificate resolver (HTTP challenge)
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.letsencrypt.acme.email=${TLS_EMAIL:-admin@progresslab.it}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      # File provider for custom certificates
      - --providers.file.directory=/letsencrypt/custom
      - --providers.file.watch=true
    ports:
      - target: 443
        published: 443
        protocol: tcp
        mode: host
    volumes:
      - letsencrypt:/letsencrypt

  # TLS configuration for database service
  db:
    deploy:
      labels:
        - "traefik.http.routers.db.tls.certresolver=letsencrypt"

  # TLS configuration for API service
  api:
    deploy:
      labels:
        - "traefik.http.routers.api.tls.certresolver=letsencrypt"

  # TLS configuration for main app service
  app:
    deploy:
      labels:
        - "traefik.http.routers.app.tls.certresolver=letsencrypt"

  # TLS configuration for workflow server
  wf-server:
    deploy:
      labels:
        - "traefik.http.routers.wf-server.entrypoints=websecure"
        - "traefik.http.routers.wf-server.tls.certresolver=letsencrypt"
        - "traefik.http.routers.wf-api-from-app.entrypoints=websecure"
        - "traefik.http.routers.wf-api-from-app.tls.certresolver=letsencrypt"

  # TLS configuration for reporting service
  reporting:
    deploy:
      labels:
        - "traefik.http.routers.reporting.entrypoints=websecure"
        - "traefik.http.routers.reporting.tls.certresolver=letsencrypt"

  # TLS configuration for warehouse service
  warehouse:
    deploy:
      labels:
        - "traefik.http.routers.warehouse.entrypoints=websecure"
        - "traefik.http.routers.warehouse.tls.certresolver=letsencrypt"

  # TLS configuration for notebooks service
  notebooks:
    deploy:
      labels:
        - "traefik.http.routers.notebooks.entrypoints=websecure"
        - "traefik.http.routers.notebooks.tls.certresolver=letsencrypt"
