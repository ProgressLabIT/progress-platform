volumes:
  workflow_db:
    external: true
  workflow_config:
    external: true
  flows:
    external: true

secrets:
  progress_api_db_pwd:
    external: true

networks:
  progress:
    external: true

services:
  wf-server: # Workflow Server
    image: prefecthq/prefect:3-latest
    restart: always
    depends_on:
      - workflow_db
    volumes:
      - workflow_config:/root/.prefect
    entrypoint: ["prefect", "server", "start"]
    networks:
      - progress
    environment:
      PREFECT_SERVER_API_HOST: 0.0.0.0
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://postgres:postgres@workflow-db:5432/prefect
      # Set base path for UI - Prefect will serve all assets under /workflow/
      PREFECT_UI_SERVE_BASE: /workflow
      # Set base path for API - Prefect will serve API at /workflow/api
      PREFECT_SERVER_API_BASE_PATH: /workflow/api
      # Tell the UI where to find the API
      PREFECT_UI_API_URL: https://${SUBDOMAIN}.${DOMAIN:-progresslab.it}/workflow/api
    deploy:
      replicas: 1
      labels:
        # Main config
        - "traefik.enable=true"
        - "traefik.docker.network=progress"
        - "traefik.http.services.wf-server.loadbalancer.server.port=4200"
        # Route all /workflow/* requests to Prefect - no path manipulation needed
        - "traefik.http.routers.wf-server.rule=Host(`${SUBDOMAIN}.${DOMAIN:-progresslab.it}`) && PathPrefix(`/workflow`)"
        - "traefik.http.routers.wf-server.priority=10"
        # Setting /wf-api route on main domain to bypass CORS for requests from main webapp
        - "traefik.http.routers.wf-api-from-app.priority=10"
        - "traefik.http.routers.wf-api-from-app.rule=Host(`${SUBDOMAIN}.${DOMAIN:-progresslab.it}`) && PathPrefix(`/wf-api`)"
        - "traefik.http.routers.wf-api-from-app.service=wf-server"
        - "traefik.http.routers.wf-api-from-app.middlewares=wf-api-rewrite"
        - "traefik.http.middlewares.wf-api-rewrite.chain.middlewares=strip-wf-api,add-workflow-api"
        - "traefik.http.middlewares.strip-wf-api.stripprefix.prefixes=/wf-api"
        - "traefik.http.middlewares.add-workflow-api.addprefix.prefix=/workflow/api"

  wf-system-worker: # System Workflow Worker
    image: registry.gitlab.com/progresslab/progress-platform/wf-sys-worker:${VERSION}
    restart: always
    depends_on:
      - wf-server
    networks:
      - progress
    secrets:
      - progress_api_db_pwd
    environment:
      - PREFECT_API_URL=http://wf-server:4200/workflow/api
    deploy:
      replicas: 1

  workflow-db:
    image: postgres:15.2-alpine
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=prefect
    networks:
      - progress
    expose:
      - 5432:5432
    volumes:
      - workflow_db:/var/lib/postgresql/data
    deploy:
      replicas: 1
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=progress"
        - "traefik.http.services.workflow-db.loadbalancer.server.port=5432"
