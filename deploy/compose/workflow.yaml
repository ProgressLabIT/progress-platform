volumes:
  workflow_db:
    external: true
  workflow_config:
    external: true
  flows:
    external: true

secrets:
  progress_api_db_pwd:
    external: true

networks:
  progress:
    external: true

services:
  wf-server: # Workflow Server
    image: prefecthq/prefect:3-latest
    restart: always
    depends_on:
      - workflow_db
    volumes:
      - workflow_config:/root/.prefect
    entrypoint: ["prefect", "server", "start"]
    networks:
      - progress
    environment:
      PREFECT_SERVER_API_HOST: 0.0.0.0
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://postgres:postgres@workflow-db:5432/prefect
    deploy:
      replicas: 1
      labels:
        # Main config
        - "traefik.enable=true"
        - "traefik.docker.network=progress"
        - "traefik.http.services.wf-server.loadbalancer.server.port=4200"
        # Routing to UI
        - "traefik.http.routers.wf-server.rule=Host(`workflow.${SUBDOMAIN}.${DOMAIN}`)"
        - "traefik.http.routers.wf-server.entrypoints=websecure"
        - "traefik.http.routers.wf-server.tls.certresolver=letsencrypt"
        # Setting /api/wf route on main domain to bypass CORS for requests from webapp
        - "traefik.http.routers.wf-api-from-app.entrypoints=websecure"
        - "traefik.http.routers.wf-api-from-app.rule=Host(`${SUBDOMAIN}.${DOMAIN}`) && PathPrefix(`/wf-api`)"
        - "traefik.http.routers.wf-api-from-app.service=wf-server"
        - "traefik.http.routers.wf-api-from-app.tls.certresolver=letsencrypt"
        - "traefik.http.routers.wf-api-from-app.middlewares=no-cors-api-from-app"
        - "traefik.http.middlewares.no-cors-api-from-app.chain.middlewares=strip-custom, add-original"
        - "traefik.http.middlewares.strip-custom.stripprefix.prefixes=/wf-api"
        - "traefik.http.middlewares.add-original.addprefix.prefix=/api"

  wf-system-agent: # System Workflow Agent
    image: registry.gitlab.com/progresslab/progress-platform/wf-sys-agent:${VERSION}
    restart: always
    depends_on:
      - wf-server
    networks:
      - progress
    secrets:
      - progress_api_db_pwd
    environment:
      - PREFECT_API_URL=http://wf-server:4200/api
    deploy:
      replicas: 1

  workflow-db:
    image: postgres:15.2-alpine
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=prefect
    networks:
      - progress
    expose:
      - 5432:5432
    volumes:
      - workflow_db:/var/lib/postgresql/data
    deploy:
      replicas: 1
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=progress"
        - "traefik.http.services.workflow-db.loadbalancer.server.port=5432"
