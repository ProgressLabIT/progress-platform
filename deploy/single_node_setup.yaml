---
- name: Setup server and deploy Progress Platform in single-node mode
  hosts: all
  become: true
  #debugger: on_failed

  vars:
    root_dir: /opt/progress
    image_tag: "0.9-latest"
    domain: "progresslab.it"
    volumes:
      - db_data
      - db_backup
      - workflow_db
      - workflow_config
      - flows
      - media
      - logs
      - reports
      - cmounts
      - notebooks
      - letsencrypt
    additional_folders:
      - config
    swarm_join_tkn_manager: "{{ init.swarm_facts.JoinTokens.Manager }}"
    swarm_join_tkn_worker: "{{ init.swarm_facts.JoinTokens.Worker }}"
    registry_url: registry.gitlab.com/progresslab/progress-platform
    secrets:
      - { name: "progress_api_db_pwd", length: 32 }
      - { name: "progress_admin_pwd", length: 6 }
      - { name: "progress_jwt_secret", length: 32 }

  vars_files:
    - registry_creds

  tasks:
    - name: Setup system
      tags: system
      block:
        - name: Install aptitude
          apt:
            name: aptitude
            state: latest
            update_cache: true

        - name: Install required system packages
          apt:
            pkg:
              - apt-transport-https
              - ca-certificates
              - curl
              - software-properties-common
              - python3-pip
              - virtualenv
              - python3-setuptools
            state: latest
            update_cache: true

        - name: Add Docker GPG apt Key
          apt_key:
            url: https://download.docker.com/linux/ubuntu/gpg
            state: present

        - name: Add Docker Repository
          apt_repository:
            repo: deb https://download.docker.com/linux/ubuntu focal stable
            state: present

        - name: Update apt and install docker-ce
          apt:
            name: docker-ce
            state: latest
            update_cache: true

        - name: Install required python packages
          tags: pip
          pip:
            name:
              - docker
              - jsondiff
              - pyyaml

    - name: Setup folders
      tags: folders
      block:
        - name: Create main project directory
          ansible.builtin.file:
            path: "{{ root_dir }}"
            state: directory

        - name: Create project subdirectories
          ansible.builtin.file:
            path: "{{ root_dir }}/{{ item }}"
            state: directory
          loop: "{{ volumes + additional_folders }}"

    - name: Setup infrastructure
      tags: docker
      block:
        - name: Login to GitLab container registry
          community.docker.docker_login:
            registry_url: "{{ registry_url }}"
            username: "{{ registry_username }}"
            password: "{{ registry_token }}"

        - name: Create docker volumes
          community.docker.docker_volume:
            name: "{{ item }}"
            driver_options:
              o: bind
              type: none
              device: "{{ root_dir }}/{{ item }}"
          loop: "{{ volumes }}"

        - name: Activate Swarm mode
          community.docker.docker_swarm:
            state: present
          register: init

        - name: Create networks
          community.docker.docker_network:
            name: "{{ item }}"
            attachable: true
            driver: overlay
          loop:
            - reporting
            - progress

        - name: Generate secrets
          ansible.builtin.shell:
            cmd: "openssl rand -hex {{ item.length }} | docker secret create {{ item.name }} -"
          loop: "{{ secrets }}"

    - name: Deploy stack
      tags: deploy
      block:
        - name: Copy deployment files
          ansible.builtin.copy:
            src: compose/ # copy contents only
            dest: "{{ root_dir }}/config/"

        - name: Copy api config files
          ansible.builtin.copy:
            src: "config/{{ item }}"
            dest: "{{ root_dir }}/config/{{ item }}"
          loop:
            - apiConfig.js
            - api.env

        - name: Generate DB root password
          ansible.builtin.shell:
            cmd: "openssl rand -hex 12"
          register: db_root_pwd

        - name: Show DB root password
          ansible.builtin.debug:
            var: db_root_pwd.stdout

        - name: Deploy to production
          community.docker.docker_stack:
            name: progress
            with_registry_auth: yes
            compose:
              - "{{ root_dir}}/config/base.yaml"
              - "{{ root_dir}}/config/stack.yaml"
              - "{{ root_dir}}/config/workflow.yaml"
          environment:
            VERSION: "{{ image_tag }}"
            DB_ROOT_PWD: "{{ db_root_pwd.stdout }}"
            DOMAIN: "{{ domain }}"
            SUBDOMAIN: "{{ subdomain }}"

        - name: Copy init script to be run
          ansible.builtin.copy:
            src: scripts/db_init.py
            dest: "{{ root_dir }}/db_init.py"

        - name: Run service to initialize databases and its users
          # Requires a service to use secrets created before
          community.docker.docker_swarm_service:
            name: init-db
            image: "{{ registry_url}}/api"
            restart_config:
              condition: none
            secrets:
              - secret_name: progress_admin_pwd
              - secret_name: progress_api_db_pwd
            networks:
              - progress
            mounts:
              - source: "{{ root_dir }}/db_init.py"
                target: /db_init.py
                type: bind
            env:
              DB_ROOT_PWD: "{{ db_root_pwd.stdout }}"
            command: python3 /db_init.py

        # Last try failed when loading flows because the agent container was not ready, probably busy installing python dependencies
        # - name: Wait for agent setup to finish
        #   ansible.builtin.wait_for:
        #     timeout: 30

        # - name: Deploy system workflows
        #   ansible.builtin.shell:
        #     cmd: 'docker exec $(docker ps -q --filter name=system) python /flows/sys_loader.py'

