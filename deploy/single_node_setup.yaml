---
- name: Setup server and deploy Progress Platform in single-node mode
  hosts: all
  become: true
  #debugger: on_failed

  vars:
    # Deployment vars
    public_env_vars:
      - VERSION
      - DOMAIN
      - SUBDOMAIN
    private_env_vars: []
    # Optional vars (not required, have defaults)
    optional_env_vars:
      - ENABLE_TLS
      - TLS_EMAIL
    root_dir: /opt/progress
    venv_path: /opt/progress/.venv
    volumes:
      - db_data
      - db_backup
      - workflow_db
      - workflow_config
      - flows
      - media
      - logs
      - reports
      - cmounts
      - notebooks
      - letsencrypt
    additional_folders:
      - config
    swarm_join_tkn_manager: "{{ init.swarm_facts.JoinTokens.Manager }}"
    swarm_join_tkn_worker: "{{ init.swarm_facts.JoinTokens.Worker }}"
    registry_url: registry.gitlab.com/progresslab/progress-platform
    progress_env_filename: "progress.env"
    secrets:
      - { name: "progress_api_db_pwd", length: 32 }
      - { name: "progress_admin_pwd", length: 16 }
      - { name: "progress_jwt_secret", length: 32 }
      - { name: "progress_db_root_pwd", length: 16 }

  vars_files:
    - registry_creds

  tasks:
    - name: Load environment variables from progress.env.yaml
      include_vars:
        file: config/progress.env.yaml
        name: progress_env_vars

    - name: Validate and set required environment variables
      fail:
        msg: "{{ item }} is not set in progress.env.yaml"
      when: progress_env_vars[item] is not defined or not progress_env_vars[item]
      loop: "{{ public_env_vars + private_env_vars }}"

    - name: Setup system
      tags: system
      block:
        - name: Install aptitude
          apt:
            name: aptitude
            state: latest
            update_cache: true

        - name: Install required system packages
          apt:
            pkg:
              - apt-transport-https
              - ca-certificates
              - curl
              - software-properties-common
              - python3-pip
              - python3-venv
              - python3-setuptools
            state: latest
            update_cache: true

        - name: Add Docker GPG apt Key
          apt_key:
            url: https://download.docker.com/linux/ubuntu/gpg
            state: present

        - name: Add Docker Repository
          apt_repository:
            repo: deb https://download.docker.com/linux/ubuntu noble stable
            state: present

        - name: Update apt and install docker-ce
          apt:
            name: docker-ce
            state: latest
            update_cache: true

        - name: Create virtual environment for Ansible dependencies
          tags: pip
          command: "python3 -m venv {{ venv_path }}"
          args:
            creates: "{{ venv_path }}/bin/activate"

        - name: Install Python dependencies in virtual environment
          tags: pip
          pip:
            name:
              - docker
              - jsondiff
              - pyyaml
            virtualenv: "{{ venv_path }}"
          vars:
            ansible_python_interpreter: /usr/bin/python3

    - name: Setup folders
      tags: folders
      block:
        - name: Create main project directory
          ansible.builtin.file:
            path: "{{ root_dir }}"
            state: directory

        - name: Create project subdirectories
          ansible.builtin.file:
            path: "{{ root_dir }}/{{ item }}"
            state: directory
          loop: "{{ volumes + additional_folders }}"

        - name: Create custom certificates directory
          ansible.builtin.file:
            path: "{{ root_dir }}/letsencrypt/custom"
            state: directory
            mode: '0700'

    - name: Setup infrastructure
      tags: docker
      vars:
        ansible_python_interpreter: "{{ venv_path }}/bin/python"
      block:
        - name: Login to GitLab container registry
          community.docker.docker_login:
            registry_url: "{{ registry_url }}"
            username: "{{ registry_username }}"
            password: "{{ registry_token }}"

        - name: Create docker volumes
          community.docker.docker_volume:
            name: "{{ item }}"
            driver_options:
              o: bind
              type: none
              device: "{{ root_dir }}/{{ item }}"
          loop: "{{ volumes }}"

        - name: Activate Swarm mode
          community.docker.docker_swarm:
            state: present
          register: init

        - name: Create networks
          community.docker.docker_network:
            name: "{{ item }}"
            attachable: true
            driver: overlay
          loop:
            - reporting
            - progress

        - name: Generate secrets
          ansible.builtin.shell:
            cmd: "openssl rand -hex {{ item.length }} | docker secret create {{ item.name }} -"
          loop: "{{ secrets }}"

    - name: Deploy stack
      tags: deploy
      vars:
        ansible_python_interpreter: "{{ venv_path }}/bin/python"
      block:
        - name: Copy deployment files
          ansible.builtin.copy:
            src: compose/ # copy contents only
            dest: "{{ root_dir }}/config/"

        - name: Copy api config files
          ansible.builtin.copy:
            src: "config/{{ item }}"
            dest: "{{ root_dir }}/config/{{ item }}"
          loop:
            - appConfig.js
            - api.env

        - name: Copy reports application files
          ansible.builtin.copy:
            src: scripts/{{ item }}
            dest: "{{ root_dir }}/reports/{{ item }}"
          loop:
            - main.py
            - entrypoint.sh

        - name: Create progress.env file with non-secret environment variables
          ansible.builtin.template:
            src: config/env_template.j2
            dest: "{{ root_dir }}/config/{{ progress_env_filename }}"
          vars:
            # Combine required and optional vars for template
            all_env_vars: "{{ public_env_vars + private_env_vars + optional_env_vars }}"
            progress_env_vars: "{{ progress_env_vars }}"

        - name: Deploy to production with TLS
          # Load environment variables from progress.env file before running docker stack deploy
          ansible.builtin.shell:
            executable: /bin/bash
            cmd: |
              cd {{ root_dir }}/config && \
              export $(cat {{ progress_env_filename }} | xargs) && \
              docker stack deploy \
                --with-registry-auth \
                -c base.yaml \
                -c stack.yaml \
                -c tls.yaml \
                -c warehouse.yaml \
                -c workflow.yaml \
                -c integration.yaml \
                -c reporting.yaml \
                -c notebooks.yaml \
                progress
          when: progress_env_vars.ENABLE_TLS | default('true') | bool

        - name: Deploy to production without TLS
          # Load environment variables from progress.env file before running docker stack deploy
          ansible.builtin.shell:
            executable: /bin/bash
            cmd: |
              cd {{ root_dir }}/config && \
              export $(cat {{ progress_env_filename }} | xargs) && \
              docker stack deploy \
                --with-registry-auth \
                -c base.yaml \
                -c stack.yaml \
                -c warehouse.yaml \
                -c workflow.yaml \
                -c integration.yaml \
                -c reporting.yaml \
                -c notebooks.yaml \
                progress
          when: not (progress_env_vars.ENABLE_TLS | default('true') | bool)

        - name: Copy init script to be run
          ansible.builtin.copy:
            src: scripts/db_init.py
            dest: "{{ root_dir }}/db_init.py"

        - name: Run service to initialize databases and its users
          # Requires a service to use secrets created before
          community.docker.docker_swarm_service:
            name: init-db
            image: "{{ registry_url}}/api"
            restart_config:
              condition: none
            secrets:
              - secret_name: progress_admin_pwd
              - secret_name: progress_api_db_pwd
              - secret_name: progress_db_root_pwd
              - secret_name: progress_jwt_secret
            networks:
              - progress
            mounts:
              - source: "{{ root_dir }}/db_init.py"
                target: /db_init.py
                type: bind
              - source: "{{ root_dir }}/config"
                target: /output
                type: bind
            command: python3 /db_init.py

        # Last try failed when loading flows because the agent container was not ready, probably busy installing python dependencies
        # - name: Wait for agent setup to finish
        #   ansible.builtin.wait_for:
        #     timeout: 30

        # - name: Deploy system workflows
        #   ansible.builtin.shell:
        #     cmd: 'docker exec $(docker ps -q --filter name=system) python /flows/sys_loader.py'

