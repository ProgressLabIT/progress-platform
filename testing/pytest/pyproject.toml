[project]
name = "progress-test-suite"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pytest>=9.0",
    "pytest-asyncio>=0.21",
    "testcontainers>=4.14",
    "httpx>=0.28",
    "pytest-cov>=7.1",
    "python-arango>=8",
    "PyJWT>=2.0",
    "passlib==1.7.2",
    "bcrypt==4.3.*",
    "python-jose",
    "cryptography>=41.0",
    "pydantic>=2",
    "pydantic-settings>=2",
    "python-dateutil>=2.8",
    "python-multipart",
    "starlette",
    "fastapi",
    "uvicorn",
    "nats-py",
    "openpyxl>=3",
    "pypdf>=4",
    "reportlab>=4",
    "httpx>=0.28",
    "confluent-kafka",
    "schemathesis>=4.15",
    "locust>=2.0",
    "aiomqtt==2.5.1",
    "docker>=7.0",
    "protobuf>=4.0",
    "asyncpg==0.31.0",
    "typer>=0.25.1",
]

[tool.pytest.ini_options]
addopts = "-m 'not integration'"
asyncio_mode = "auto"
pythonpath = ["../../backend/api"]
testpaths = ["tests"]
markers = [
    "integration: tests that require an already-deployed docker stack (e.g. Sparkplug spike)",
]

[tool.hatch.build.targets.wheel]
packages = ["conftest_helpers"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
