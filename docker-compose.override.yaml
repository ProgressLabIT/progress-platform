---

# Overlay docker-compose config for a local development environment
#
version: '3.7'

x-template:
  comune: &comune
    volumes:
      # Mounting volume to allow auto-reload on dev env
      - ./backend/api:/api
    env_file:
      # Use these environment variables to define dev runtime
      - docker/env.dev

services:
  api_server:
    <<: *comune
    command: >
      uvicorn main:app --host 0.0.0.0 --port 80 --root-path /api
      --reload --log-level=debug

  webapp_main:
    volumes:
      # Mounting volume to allow auto-reload on dev env
      - ./webapps/main/src:/main/src

  nginx:
    volumes:
      - ./docker/nginx-dev.conf:/etc/nginx/nginx.conf

  arangodb:
    command: >
      arangod --server.authentication=false --config /tmp/arangod.conf

      --rocksdb.max-total-wal-size 1024000
      --rocksdb.write-buffer-size 2048000
      --rocksdb.max-write-buffer-number 2
      --rocksdb.total-write-buffer-size 81920000
      --rocksdb.dynamic-level-bytes false

      --rocksdb.block-cache-size 2560000
      --rocksdb.enforce-block-cache-size-limit true
      --cache.size 10485760

      --server.statistics false

      --javascript.v8-contexts 2
      --javascript.v8-max-heap 512
