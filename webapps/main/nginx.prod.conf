# 3. Update CORS settings for object storage domain

# user  nginx;
worker_processes  1;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;


events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log main;

    keepalive_timeout  60;

    gzip  on;

    server {
      listen 80;
      location / {
          root /usr/share/nginx/html;
          try_files $uri $uri/ /index.html;
      }

      # TODO: OBJECT STORAGE MIGRATION - Add location block for object storage proxy if needed
      # location /media/ {
      #     proxy_pass https://your-object-storage-domain/;
      #     proxy_set_header Host your-object-storage-domain;
      # }
    }
}
