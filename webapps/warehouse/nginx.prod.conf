# user  nginx;
worker_processes  1;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;


events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log main;

    keepalive_timeout  60;

    gzip  on;

    server {
      listen 80;
      root /usr/share/nginx/html;

      # TLS is terminated upstream (Traefik); nginx only ever sees http on :80.
      # Emit relative Location headers so redirects never downgrade https→http
      # and trip Mixed Content blocking in the browser.
      absolute_redirect off;

      # Hashed Vite assets are safe to cache long-term.
      location /assets/ {
          expires 1y;
          add_header Cache-Control "public, immutable";
      }

      # The SPA entrypoint must always be fresh after deploys.
      location = /index.html {
          add_header Cache-Control "no-cache, no-store, must-revalidate";
          add_header Pragma "no-cache";
          add_header Expires "0";
      }

      # Runtime env file mounted at deploy time; never cache it.
      location = /config.js {
          # 404 if the mount is missing/a directory, rather than 301-redirecting
          # to /config.js/ (which the browser blocks as Mixed Content).
          try_files $uri =404;
          add_header Cache-Control "no-cache, no-store, must-revalidate";
          add_header Pragma "no-cache";
          add_header Expires "0";
      }

      location / {
          try_files $uri $uri/ /index.html;
          add_header Cache-Control "no-cache, no-store, must-revalidate";
          add_header Pragma "no-cache";
          add_header Expires "0";
      }
    }
}
